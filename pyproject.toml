[project]
name = "frappe_sign"
authors = [
    { name = "Upscape Technologies", email = "info@upscapetech.com"}
]
description = "E-signatures for Frappe and ERPNext v16"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe is installed and managed by bench, see [tool.bench.frappe-dependencies].
    # pypdf and cryptography are pinned exactly by frappe (pypdf 6.6.0 and cryptography 46 in
    # v16.0.0), so these ranges must include every v16 pin.
    "pypdf>=6.6.0,<7.0.0",
    "reportlab>=4.4.0,<6.0.0",
    # pyhanko 0.35+ needs cryptography 47+, but frappe v16.0.0 pins cryptography~=46.0.3. A wider
    # range makes pip upgrade cryptography past frappe's pin, so stay on 0.34 until the floor moves.
    "pyhanko>=0.34.0,<0.35.0",
    "arabic-reshaper>=3.0.0,<4.0.0",
    "python-bidi>=0.6.0,<0.7.0",
    "qrcode>=8.0,<9.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.bench.dev-dependencies]
# Test only: rasterizes pages for visual snapshot tests.
pypdfium2 = ">=4.30.0,<6.0.0"
mypy = ">=2.4.0,<3.0.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"
# Semgrep rule test cases break lint rules on purpose.
extend-exclude = [".semgrep"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

# Strict typing for the layers with the most logic (CLAUDE.md). Run with
# `mypy` from the app root or `pre-commit run mypy --all-files`.
[tool.mypy]
python_version = "3.14"
files = ["frappe_sign/services", "frappe_sign/pdf", "frappe_sign/crypto"]
strict = true
follow_imports = "silent"
warn_unused_configs = true

# frappe and erpnext ship no type information; treat them as Any.
[[tool.mypy.overrides]]
module = ["frappe", "frappe.*", "erpnext", "erpnext.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arabic_reshaper", "arabic_reshaper.*", "bidi", "bidi.*", "asn1crypto", "asn1crypto.*"]
ignore_missing_imports = true
