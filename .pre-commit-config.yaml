exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "frappe_sign.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  # Strict on services/, pdf/ and crypto/ (see [tool.mypy] in pyproject.toml). frappe is not on
  # PyPI, so it is typed as Any here.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: ^frappe_sign/(services|pdf|crypto)/
        args: []
        additional_dependencies:
          - "pypdf>=6.6.0,<7.0.0"
          - "pyhanko>=0.34.0,<0.35.0"
          - "cryptography>=46.0.3"
          - "qrcode>=8.0,<9.0"
          - "types-reportlab"
          - "pillow"
          - "python-pkcs11>=0.7.0,<1.0.0"
          - "aiohttp>=3.9.0,<4.0.0"
          - "tzlocal>=5.0,<6.0"

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.182.1
    hooks:
      - id: semgrep
        args:
          - --config=.semgrep/rules
          - --config=.semgrep/frappe
          - --error
          - --metrics=off
          - --skip-unknown-extensions
          - --quiet
        exclude: ^\.semgrep/

  - repo: local
    hooks:
      - id: semgrep-rule-tests
        name: Test project semgrep rules
        language: python
        additional_dependencies: ["semgrep==1.182.1"]
        entry: semgrep --test --metrics=off .semgrep/rules
        pass_filenames: false
        files: ^\.semgrep/rules/

      - id: no-em-dash
        name: No em dashes (golden rule 12)
        language: pygrep
        entry: '\xe2\x80\x94'  # UTF-8 bytes of U+2014
        exclude: ^\.semgrep/frappe/

      # The frontend has its own Prettier 3, ESLint and vue-tsc setup. Run `yarn install` in the
      # app root first (it installs frontend/ too).
      - id: frontend-prettier
        name: Prettier (frontend)
        language: system
        entry: frontend/node_modules/.bin/prettier --write --ignore-unknown --ignore-path frontend/.prettierignore
        files: ^frontend/

      - id: frontend-eslint
        name: ESLint (frontend)
        language: system
        entry: bash -c 'cd frontend && node_modules/.bin/eslint --max-warnings 0 .'
        pass_filenames: false
        files: ^frontend/

      - id: frontend-typecheck
        name: vue-tsc (frontend)
        language: system
        entry: bash -c 'cd frontend && node_modules/.bin/vue-tsc --noEmit'
        pass_filenames: false
        files: ^frontend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Desk JS only; frontend/ has its own Prettier. Ignore files that might contain jinja / bundles.
        exclude: |
            (?x)^(
                frontend/.*|
                frappe_sign/public/frontend/.*|
                frappe_sign/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                frappe_sign/templates/includes/.*|
                frappe_sign/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Desk JS only; frontend/ has its own ESLint. Ignore files that might contain jinja / bundles.
        exclude: |
            (?x)^(
                frontend/.*|
                frappe_sign/public/frontend/.*|
                frappe_sign/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                frappe_sign/templates/includes/.*|
                frappe_sign/public/js/lib/.*
            )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
